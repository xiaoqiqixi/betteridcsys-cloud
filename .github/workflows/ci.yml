name: Cloud controller and node checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go-unit:
    name: Linux unit and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache: false
      - name: Workflow syntax
        run: bash aster-cloud/deploy/ci/lint-workflows.sh
      - name: Verify minimal billing protocol SDK
        run: |
          python3 scripts/verify-billing-contract.py
          cd contracts/billing
          go test -mod=readonly -race -count=1 ./...
      - name: Linux unit, vet and build (native MySQL/KVM are separate gates)
        working-directory: aster-cloud
        run: |
          go mod download
          go mod verify
          python3 -I deploy/ci/go-race.py
          go vet -mod=readonly ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=readonly -trimpath -buildvcs=false ./cmd/aster-controller ./cmd/aster-node ./cmd/aster-network ./cmd/aster-billing-plugin
      - name: Offline package and SDK-layout safety contracts (not host installation)
        run: python3 -B aster-cloud/deploy/scripts/test_cloud_package.py
      - name: Real controller CLI admission fence and process drain (not complete migration)
        working-directory: aster-cloud
        run: |
          go build -mod=readonly -trimpath -buildvcs=false -o "$RUNNER_TEMP/aster-controller-host-test" ./cmd/aster-controller
          sudo /usr/bin/python3 -I deploy/ci/test_controller_host.py --binary "$RUNNER_TEMP/aster-controller-host-test"
      - name: Installed target preparation and persistent seal (not complete migration)
        working-directory: aster-cloud
        run: |
          go test -mod=readonly -c -o "$RUNNER_TEMP/aster-target-source-fixture.test" ./cmd/aster-controller
          sudo /usr/bin/python3 -I deploy/ci/test_controller_target.py --binary "$RUNNER_TEMP/aster-controller-host-test" --fixture-binary "$RUNNER_TEMP/aster-target-source-fixture.test" --source "$GITHUB_SHA"
      - name: Independent root and non-root verification process guards (not service activation)
        working-directory: aster-cloud
        run: |
          set -euo pipefail
          fixture="$PWD/internal/controllerhost/verification_fixture_test.go"
          test ! -e "$fixture"
          cp deploy/ci/verification-guard-fixture.gotxt "$fixture"
          trap 'rm -f "$fixture"' EXIT
          go test -mod=readonly -c -o "$RUNNER_TEMP/aster-verification-guard.test" ./internal/controllerhost
          # The runner, not root, owns the public evidence file. pipefail keeps
          # a failed privileged test fatal even when tee succeeds.
          sudo /usr/bin/python3 -I deploy/ci/test_controller_verification_guard.py --fixture-binary "$RUNNER_TEMP/aster-verification-guard.test" --source "$GITHUB_SHA" | tee "$RUNNER_TEMP/verification-guard.json"
          python3 -I - <<'PYTEST'
          import json, os, pathlib
          value = json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'verification-guard.json').read_text())
          assert value['schema'] == 1 and value['source_sha'] == os.environ['GITHUB_SHA']
          positive = set('passed real_linux_processes nonroot_child independent_parent_child_locks parent_descriptor_not_inherited child_unlock_retains_parent_guard parent_exit_retains_child_guard both_processes_exited_before_drain target_seal_unchanged'.split())
          negative = set('http_started mysql_verified migration_ready'.split())
          assert set(value) == positive | negative | {'schema','source_sha'}
          assert all(value[k] is True for k in positive) and all(value[k] is False for k in negative)
          PYTEST
      - name: Retain sanitized verification guard proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-guard-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification-guard.json
          if-no-files-found: warn
          retention-days: 7
          overwrite: false
      - name: Published installer commands and proof boundaries
        run: |
          python3 -B aster-cloud/deploy/ci/test_unified_install.py
          python3 -B aster-cloud/deploy/ci/test_host_migration_entry.py
          python3 -B aster-cloud/deploy/ci/test_go_race.py
          python3 -B aster-cloud/deploy/ci/test_install_entrypoints.py
          python3 -B aster-cloud/deploy/ci/test_public_cloud_evidence.py
          python3 -B aster-cloud/deploy/ci/check_install_entrypoints.py --readme README.md --entry aster-cloud/deploy/install/cloud.py --bootstrap aster-cloud/deploy/install/release_verify.py
      - name: Native installer and disposable fixture safety contracts (no host apply)
        run: |
          bash -n aster-cloud/deploy/install/controller.sh aster-cloud/deploy/install/node.sh aster-cloud/deploy/ci/native-mysql/mysql-native.sh
          python3 -B aster-cloud/deploy/install/test_install.py
          python3 -B aster-cloud/deploy/ci/test_cloud_installer.py
          python3 -B aster-cloud/deploy/ci/test_cloud_release_verifier.py
          python3 -B aster-cloud/deploy/ci/test_libvirt_native.py
          python3 -B aster-cloud/deploy/ci/test_network_readiness.py
          python3 -B aster-cloud/deploy/ci/test_prepare_cloud_runner.py
          python3 -B aster-cloud/deploy/ci/native-mysql/test_mysql_distribution.py
          python3 -B aster-cloud/deploy/ci/native-mysql/test_mysql_native.py
  frontend:
    name: Vue management console checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Management UI checks
        working-directory: aster-cloud/frontend
        run: |
          npm ci --include=dev --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
          npm run format:check
          npm audit --audit-level=high

  native-libvirt:
    name: Native libvirt preparation (ubuntu-${{ matrix.ubuntu }})
    strategy:
      fail-fast: false
      matrix:
        # All emulator hosts use reviewed libslirp 4.7.x (loopback-only command
        # socketpair). The independently signed guests run supported 22/24.
        # Ubuntu 26 is deferred, not a failed result reclassified as passing.
        include:
          - os: ubuntu-24.04
            ubuntu: '22.04'
          - os: ubuntu-24.04
            ubuntu: '24.04'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install emulator and image-verification tools, not a host libvirt service
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y qemu-system-x86 qemu-utils cloud-image-utils gnupg
      - name: Read-only host network readiness before native baseline
        timeout-minutes: 4
        run: python3 -I aster-cloud/deploy/ci/network-readiness.py
      - name: Real signed Ubuntu guest APT, systemd and libvirt; no fake KVM device
        env:
          TEST_UBUNTU: ${{ matrix.ubuntu }}
        run: |
          set -euo pipefail
          python3 -I aster-cloud/deploy/ci/libvirt-native.py \
            --ubuntu "$TEST_UBUNTU" --source-root "$GITHUB_WORKSPACE" \
            --source-sha "$GITHUB_SHA" --output "$RUNNER_TEMP/cloud-libvirt-native"
      - name: Independently require exact-source native proof, never KVM readiness
        env:
          TEST_UBUNTU: ${{ matrix.ubuntu }}
        run: |
          python3 -I - <<'PYTEST'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'cloud-libvirt-native'
          summary = json.loads((root / 'summary.json').read_text())
          guest = json.loads((root / 'guest-report.json').read_text())
          for proof in (summary, guest):
              assert proof['schema'] == 1 and proof['source_sha'] == os.environ['GITHUB_SHA']
              assert proof['ubuntu'] == os.environ['TEST_UBUNTU']
              assert all(proof[k] is True for k in ('passed', 'real_apt', 'real_systemd', 'libvirt_prepared'))
              assert proof['kvm_ready'] is False
          assert summary['host_network_unchanged'] is True and summary['tcg_only'] is True
          assert summary['host_network_pre_vm_proof']['unchanged'] is True
          assert summary['host_network_proof']['unchanged'] is True
          assert summary['host_process_isolation_verified'] is True and summary['sandbox_selftests_passed'] is True
          assert summary['relay_cleanup_verified'] is True
          assert guest['explicit_kvm_denial'] is True and guest['non_kvm_doctor_checks_passed'] is True
          assert guest['default_network_absent'] is True and guest['virbr_absent'] is True
          assert guest['libvirt_no_tcp_listener'] is True and guest['empty_network_mount_verified'] is True
          assert guest['owned_units_active'] is True and guest['vendor_masks_persistent'] is True
          PYTEST
      - name: Retain only sanitized native preparation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-libvirt-native-ubuntu-${{ matrix.ubuntu }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cloud-libvirt-native/summary.json
            ${{ runner.temp }}/cloud-libvirt-native/guest-report.json
            ${{ runner.temp }}/cloud-libvirt-native/image-provenance.json
          if-no-files-found: warn
          retention-days: 7
          overwrite: false

  native-controller-provision:
    name: Native ${{ matrix.scenario }} (ubuntu-${{ matrix.ubuntu }})
    strategy:
      fail-fast: false
      matrix:
        # All emulator hosts use reviewed libslirp 4.7.x (loopback-only command
        # socketpair). The independently signed guests run supported 22/24.
        # Ubuntu 26 is deferred, not a failed result reclassified as passing.
        os: [ubuntu-24.04]
        ubuntu: ['22.04', '24.04']
        scenario: ['controller-restore-data', 'controller-restore-sessions', 'controller-restore-configuration']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 85
    # Each required scenario recreates real import prerequisites at this SHA.
    # 15m source SQL + unchanged 60m VM + setup/cleanup, no retry/gate waiver.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install emulator and image-verification tools, not a host MySQL service
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y qemu-system-x86 qemu-utils cloud-image-utils gnupg libaio1t64 libssl3t64 libtirpc3t64
      - name: Read-only host network readiness before native baseline
        timeout-minutes: 4
        run: python3 -I aster-cloud/deploy/ci/network-readiness.py
      - name: Actual signed Ubuntu target provisioning, import and read-only recovery
        env:
          TEST_UBUNTU: ${{ matrix.ubuntu }}
          TEST_SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          python3 -I aster-cloud/deploy/ci/libvirt-native.py --scenario "$TEST_SCENARIO" \
            --ubuntu "$TEST_UBUNTU" --source-root "$GITHUB_WORKSPACE" \
            --source-sha "$GITHUB_SHA" --output "$RUNNER_TEMP/cloud-controller-provision"
      - name: Independently reject migration and real-source overclaims
        env:
          TEST_UBUNTU: ${{ matrix.ubuntu }}
          TEST_SCENARIO: ${{ matrix.scenario }}
        run: |
          python3 -I - <<'PYTEST'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'cloud-controller-provision'
          common = set('passed real_apt real_systemd real_mysql actual_installer actual_controller target_sealed exact_encoding_preserved credentials_verified runtime_ddl_denied same_operation_preserved source_fixture_synthetic database_restored real_source_database_snapshot exact_rows_verified runtime_materials_staged runtime_candidate_remains_fenced'.split())
          phases = {
              'controller-restore-data': set('foreign_account_refused lost_credential_refused_without_reset maintenance_authentication_verified maintenance_drift_refused maintenance_nonroot_denied read_only_reentry_verified modified_data_refused removed_constraint_refused foreign_database_refused runtime_material_drift_refused'.split()),
              'controller-restore-sessions': set('sessions_revoked session_transition_exact_readback session_transition_explicit_recovery'.split()),
              'controller-restore-configuration': set('sessions_revoked configuration_plan_verified configuration_plan_readonly configuration_plan_tls_drift_refused configuration_plan_requires_exact_session_postimage configuration_published configuration_publication_readonly configuration_partial_resume_verified published_configuration_remains_fenced verification_sql_plan_bound_readonly verification_account_prepared verification_account_exact_grants verification_account_readonly_reentry verification_account_foreign_refused verification_account_drift_not_repaired verification_credential_authenticated verification_revocation_locked verification_revocation_active_session_refused verification_revocation_readonly_recovery verification_revocation_no_implicit_unlock verification_revocation_pending_auth_refused verification_revocation_internal_thread_classified verification_data_phase_bound verification_data_auth_delta_validated verification_data_drift_refused verification_data_immutable_intent verification_data_revocation_compatible verification_runtime_credential_revalidated verification_runtime_preserves_original_phase verification_runtime_drift_and_revocation_refused'.split()),
          }
          expected = common | phases[os.environ['TEST_SCENARIO']]
          denied = set('source_host_export_verified node_takeover_verified migration_ready kvm_ready session_browser_verified'.split())
          for name in ('summary.json', 'guest-report.json'):
              value = json.loads((root / name).read_text())
              assert value['schema'] == 1 and value['source_sha'] == os.environ['GITHUB_SHA']
              assert value['ubuntu'] == os.environ['TEST_UBUNTU'] and value['scenario'] == os.environ['TEST_SCENARIO']
              assert all(value[k] is True for k in expected)
              assert all(value[k] is False for k in denied)
              # A report must not claim another scenario's unexecuted faults.
              assert not (set().union(*phases.values()) - expected) & set(value)
              if name == 'guest-report.json':
                  assert set(value) == expected | denied | {'schema','scenario','source_sha','ubuntu','image_sha256'}
          summary = json.loads((root / 'summary.json').read_text())
          assert all(summary[k] is True for k in ('host_network_unchanged', 'tcg_only', 'host_process_isolation_verified', 'sandbox_selftests_passed', 'relay_cleanup_verified'))
          assert summary['host_network_proof']['unchanged'] is True and summary['host_network_pre_vm_proof']['unchanged'] is True
          PYTEST
      - name: Retain only sanitized native preparation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-${{ matrix.scenario }}-ubuntu-${{ matrix.ubuntu }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cloud-controller-provision/summary.json
            ${{ runner.temp }}/cloud-controller-provision/guest-report.json
            ${{ runner.temp }}/cloud-controller-provision/image-provenance.json
          if-no-files-found: warn
          retention-days: 7
          overwrite: false

  native-ovs-parser:
    name: Native OVS parser and encoder (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install parser only (no OVS service or kernel datapath)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y openvswitch-common libvirt-clients libxml2-utils
          /usr/bin/ovs-ofctl --version
      - name: Parse production flows and inspect real encoded meters; no skips
        working-directory: aster-cloud
        env:
          ASTER_NATIVE_OVS_PARSER: '1'
        run: |
          set -euo pipefail
          go test -mod=readonly -race -count=1 -timeout=3m -json ./internal/fabric -run '^TestNativeOVSParser' | tee native-ovs-parser.jsonl
          python3 - <<'PYTEST'
          import json
          events = [json.loads(line) for line in open('native-ovs-parser.jsonl')]
          assert not any(e['Action'] in ('skip', 'fail') for e in events), 'native parser gate skipped or failed'
          expected = {'TestNativeOVSParserFlows', 'TestNativeOVSParserMeters'}
          passed = {e.get('Test') for e in events if e['Action'] == 'pass'}
          assert expected <= passed, 'required native parser tests did not execute'
          PYTEST
      - name: Validate exact public NIC filter with distribution libvirt schema
        working-directory: aster-cloud
        run: |
          set -euo pipefail
          go build -mod=readonly -trimpath -buildvcs=false -o "$RUNNER_TEMP/aster-node-schema" ./cmd/aster-node
          "$RUNNER_TEMP/aster-node-schema" --print-public-network-filter aster-public-ipv4 > "$RUNNER_TEMP/aster-public-ipv4.xml"
          virt-xml-validate "$RUNNER_TEMP/aster-public-ipv4.xml" nwfilter
          # XML validation only: do not start libvirt, define filters or touch host networking.

  native-nat:
    name: Native NAT packet flow and revocation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install namespace tools (no network service)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y iproute2 nftables conntrack
          /usr/sbin/nft --version
      - name: Real isolated namespace traffic; no skips or host rule changes
        working-directory: aster-cloud
        run: |
          set -euo pipefail
          go test -mod=readonly -race -c -o "$RUNNER_TEMP/aster-nat.test" ./internal/fabric
          sudo -- env ASTER_NATIVE_NAT=1 "$RUNNER_TEMP/aster-nat.test" -test.v -test.count=1 -test.timeout=3m -test.run '^TestNativeNAT' | tee native-nat.log
          grep -q '^--- PASS: TestNativeNATPacketFlowAndRevocation ' native-nat.log
          grep -q '^--- PASS: TestNativeNATInternetEgressAndRevocation ' native-nat.log
          for marker in PUBLIC_INGRESS_DEFAULT_DENY_AND_OUTBOUND_REPLY_CONFIRMED PUBLIC_INGRESS_RELATED_ICMP_BOTH_DIRECTIONS_CONFIRMED PUBLIC_INGRESS_EXACT_SOURCE_PORT_AND_ICMP_CONFIRMED PUBLIC_INGRESS_ALL_PUBLIC_CIDR_AND_PROTECTED_FLOOR_CONFIRMED PUBLIC_INGRESS_REVOKE_CONNTRACK_AND_FINAL_READBACK_CONFIRMED PUBLIC_INGRESS_SHARED_NAT_BOUNDARY_CONFIRMED; do
            grep -q "$marker" native-nat.log
          done
          if grep -qE -- '--- (SKIP|FAIL):' native-nat.log; then
            echo 'Native NAT gate must not skip or fail.' >&2; exit 1
          fi

  native-mysql:
    name: Independent controller MySQL acceptance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Prepare disposable native runner
        run: python3 -I aster-cloud/deploy/ci/prepare-cloud-runner.py prepare
      - name: Real isolated MySQL, race and static binaries
        run: env -u ASTER_CLOUD_TEST_DSN RUNNER_TEMP="$ASTER_NATIVE_FIXTURE_ROOT" bash aster-cloud/deploy/ci/native-mysql/mysql-native.sh -- bash aster-cloud/deploy/ci/check.sh
      - name: Go vulnerability gate
        working-directory: aster-cloud
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -format=text -show=version,verbose ./...
      - name: Remove only owned native scratch
        if: always()
        run: python3 -I aster-cloud/deploy/ci/prepare-cloud-runner.py cleanup

  network-browser:
    name: Real MySQL network management browser acceptance
    runs-on: ubuntu-24.04
    # First measured tool provisioning took 21m48s. Keep the actual fixture and
    # page-operation deadlines unchanged; allow bounded distribution download time.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Build the real management frontend
        working-directory: aster-cloud/frontend
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build
      - name: Prepare disposable native runner
        run: python3 -I aster-cloud/deploy/ci/prepare-cloud-runner.py prepare
      - name: Install pinned private browser tools
        run: |
          set -euo pipefail
          umask 077
          tools_root=$(mktemp -d "$ASTER_NATIVE_FIXTURE_ROOT/browser-tools.XXXXXXXX")
          npm install --prefix "$tools_root" --ignore-scripts --no-audit --no-fund --save-exact playwright@1.64.0
          export PLAYWRIGHT_BROWSERS_PATH="$tools_root/browsers"
          node "$tools_root/node_modules/playwright/cli.js" install --with-deps firefox
          sudo apt-get install --no-install-recommends -y libnss3-tools
          printf 'PLAYWRIGHT_MODULE_DIR=%s\nPLAYWRIGHT_BROWSERS_PATH=%s\n' "$tools_root/node_modules" "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
      - name: Strict TLS desktop/mobile UI and durable MySQL history; no skips
        run: env -u ASTER_CLOUD_TEST_DSN RUNNER_TEMP="$ASTER_NATIVE_FIXTURE_ROOT" bash aster-cloud/deploy/ci/native-mysql/mysql-native.sh -- bash aster-cloud/deploy/ci/network-browser.sh
      - name: Publish only screenshots and sanitized acceptance results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: network-management-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            aster-cloud/artifacts/network-browser/*.png
            aster-cloud/artifacts/network-browser/report.json
            aster-cloud/artifacts/network-browser/tls.json
            aster-cloud/artifacts/network-browser/fixture.json
            aster-cloud/artifacts/network-browser/identity/*.png
            aster-cloud/artifacts/network-browser/identity/report.json
            aster-cloud/artifacts/network-browser/identity/fixture.json
          if-no-files-found: warn
          retention-days: 7
          overwrite: false
      - name: Remove only owned native scratch, browser profile and test certificates
        if: always()
        run: python3 -I aster-cloud/deploy/ci/prepare-cloud-runner.py cleanup
