name: Published installer download checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-install-download-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download-plan:
    name: Published ${{ matrix.role }} download and plan (${{ matrix.os }})
    if: github.repository == 'xiaoqiqixi/betteridcsys-cloud' && github.repository_id == '1435344151' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        role: [controller, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify README commands against anonymous published body and actual bootstrap bytes
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 60 --max-filesize 1048576 \
            https://api.github.com/repos/xiaoqiqixi/betteridcsys/releases/tags/cloud-v0.1.0-rc.1 > "$RUNNER_TEMP/release.json"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 60 --max-filesize 1048576 \
            https://raw.githubusercontent.com/xiaoqiqixi/betteridcsys/8092c3cc0517c69562e8a5cdd94bc5e389e1bc8e/aster-cloud/deploy/install/release_verify.py > "$RUNNER_TEMP/published-bootstrap.py"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 60 --max-filesize 1048576 \
            https://raw.githubusercontent.com/xiaoqiqixi/betteridcsys-cloud/92e484389a84312ab5b5f8d25688a93d7047926f/aster-cloud/deploy/install/cloud.py > "$RUNNER_TEMP/unified-entry.py"
          python3 -I aster-cloud/deploy/ci/check_install_entrypoints.py --readme README.md \
            --entry "$RUNNER_TEMP/unified-entry.py" --bootstrap "$RUNNER_TEMP/published-bootstrap.py" --release-metadata "$RUNNER_TEMP/release.json"
          cmp "$RUNNER_TEMP/unified-entry.py" aster-cloud/deploy/install/cloud.py
          cmp "$RUNNER_TEMP/published-bootstrap.py" aster-cloud/deploy/install/release_verify.py
      - name: Anonymous real signatures and authenticated installer plan, never host apply
        env:
          ROLE: ${{ matrix.role }}
          TARGET_OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          # Real controlling tty selects the role in the new unified entry.
          # It downloads ONLY the exact pinned legacy bootstrap, which verifies
          # its actual signatures and installer plan. No apply/start is accepted.
          # The runner intentionally owns this redacted stdout report, not root secrets.
          # shellcheck disable=SC2024
          sudo -n /usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 /usr/bin/python3 -I \
            aster-cloud/deploy/ci/unified-download.py --role "$ROLE" \
            --evidence "$RUNNER_TEMP/cloud-public-proof.json" > "$RUNNER_TEMP/cloud-unified-proof.json"
          sudo -n chmod 0644 "$RUNNER_TEMP/cloud-public-proof.json"
          python3 -I aster-cloud/deploy/ci/public_cloud_evidence.py \
            --evidence "$RUNNER_TEMP/cloud-public-proof.json" --role "$ROLE" --runner-os "$TARGET_OS" \
            > "$RUNNER_TEMP/cloud-public-verification.json"
          python3 -I - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          result = json.loads((root / 'cloud-unified-proof.json').read_text())
          assert result['schema'] == 1 and result['role'] == os.environ['ROLE']
          assert result['unified_role_menu_exercised'] is True
          assert result['host_apply'] is False and result['service_started'] is False
          assert result['entry_sha256'] == hashlib.sha256(Path('aster-cloud/deploy/install/cloud.py').read_bytes()).hexdigest()
          assert result['public_proof_sha256'] == hashlib.sha256((root / 'cloud-public-proof.json').read_bytes()).hexdigest()
          PY
      - name: Retain bounded nonsecret actual-platform evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-install-${{ matrix.os }}-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cloud-public-proof.json
            ${{ runner.temp }}/cloud-public-verification.json
            ${{ runner.temp }}/cloud-unified-proof.json
          if-no-files-found: warn
          overwrite: false
          retention-days: 7
